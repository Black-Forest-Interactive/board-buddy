micronaut:
  application:
    name: byte-buddy
  server:
    port: 8080
    max-request-size: 1MB
    thread-selection: AUTO
    netty:
      access-logger:
        enabled: true
        exclusions:
          - /health
          - /prometheus
  security:
    enabled: true
    endpoints:
      login:
        enabled: false
      oauth:
        enabled: false
    token:
      jwt:
        signatures:
          jwks:
            keycloak:
              url: ${KEYCLOAK_JWKS_URL:`https://auth.blackforrestdevelopment.de/realms/board-buddy/protocol/openid-connect/certs`}
        claims-validators:
          issuer: ${KEYCLOAK_ISSUER:`https://auth.blackforrestdevelopment.de/realms/board-buddy`}
    intercept-url-map:
      - access: isAnonymous()
        pattern: /swagger/**
      - access: isAnonymous()
        pattern: /swagger-ui/**
      - access: isAnonymous()
        pattern: /img/**
      - access: isAuthenticated()
        pattern: /**
  router:
    static-resources:
      swagger:
        paths: classpath:META-INF/swagger
        mapping: /swagger/**
      swagger-ui:
        paths: classpath:META-INF/swagger/views/swagger-ui
        mapping: /swagger-ui/**
      img:
        paths: classpath:static/img
        mapping: /img/**



datasources:
  default:
    url: jdbc:postgresql://localhost:5432/postgres
    driverClassName: org.postgresql.Driver
    username: postgres
    password: postgres
    schema-generate: NONE
    dialect: POSTGRES
    schema: board_buddy

jackson:
  serialization-inclusion: ALWAYS

board-buddy:
  # public url of the portal, used for join links and the link preview
  base-url: ${BOARD_BUDDY_BASE_URL:`https://blackforrestdevelopment.de`}
  admin:
    # keycloak client the admin tokens must be issued for (azp claim)
    authorized-party: ${KEYCLOAK_ADMIN_CLIENT:board-buddy-admin}
  portal:
    # set to false only for local development over plain http
    cookie-secure: true

flyway:
  datasources:
    default:
      enabled: true
      default-schema: board_buddy
      create-schemas: true
      schemas: board_buddy
      clean-schema: false
