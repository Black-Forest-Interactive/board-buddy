name: Release

# Creates the GitHub release "Release X.Y.Z" with tag X.Y.Z once the CI workflow succeeded for a push to master.
#   - version:  backend/gradle.properties (a trailing -SNAPSHOT is ignored), must match frontend/package.json
#   - notes:    RELEASE_NOTES_X.Y.Z.md in the repository root, the first "# ..." heading is dropped (the release has its own title)
#   - existing releases are left untouched, so later merges with the same version do nothing

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: GitHub Release
    # only after a successful CI run of a push to master (manual runs release the current master)
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    env:
      RELEASE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_SHA }}

      - name: Determine version
        id: version
        run: |
          backend=$(sed -nE 's/^version[[:space:]]*=[[:space:]]*([^[:space:]]+).*/\1/p' backend/gradle.properties)
          version=${backend%-SNAPSHOT}
          frontend=$(jq -r .version frontend/package.json)
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error file=backend/gradle.properties::Unexpected version '$backend'"
            exit 1
          fi
          if [[ "$frontend" != "$version" ]]; then
            echo "::error file=frontend/package.json::Frontend version '$frontend' does not match backend version '$version'"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Version: $version"

      - name: Check for existing release
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if gh release view "$VERSION" > /dev/null 2>&1; then
            echo "::notice::Release $VERSION already exists, nothing to do"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare release notes
        if: steps.existing.outputs.exists == 'false'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          file="RELEASE_NOTES_${VERSION}.md"
          if [[ ! -s "$file" ]]; then
            echo "::error::Missing release notes $file, add it before merging to master"
            exit 1
          fi
          # drop a leading "# Title" line and the blank lines after it
          awk 'NR==1 && /^# / {skip=1; next} skip && /^[[:space:]]*$/ {next} {skip=0; print}' "$file" > "$RUNNER_TEMP/notes.md"

      - name: Create release
        if: steps.existing.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "$VERSION" \
            --target "$RELEASE_SHA" \
            --title "Release $VERSION" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --latest
