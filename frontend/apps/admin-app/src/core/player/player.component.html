<ui-main-content [title]="'player.title' | translate">

  <button matButton="filled" actions (click)="openCreate()">
    <mat-icon>add</mat-icon>
    {{ 'player.create' | translate }}
  </button>

  <mat-table [dataSource]="items()">

    <ng-container matColumnDef="name">
      <mat-header-cell *matHeaderCellDef>{{ 'player.table.name' | translate }}</mat-header-cell>
      <mat-cell *matCellDef="let row">{{ row.name }}</mat-cell>
    </ng-container>

    <ng-container matColumnDef="type">
      <mat-header-cell *matHeaderCellDef class="!flex-none !w-28">{{ 'player.table.type' | translate }}</mat-header-cell>
      <mat-cell *matCellDef="let row" class="!flex-none !w-28">{{ 'player.type.' + row.type | translate }}</mat-cell>
    </ng-container>

    <ng-container matColumnDef="timestamp">
      <mat-header-cell *matHeaderCellDef class="!flex-none !w-44">{{ 'player.table.timestamp' | translate }}</mat-header-cell>
      <mat-cell *matCellDef="let row" class="!flex-none !w-44">{{ row.timestamp | date:'medium' }}</mat-cell>
    </ng-container>

    <ng-container matColumnDef="actions">
      <mat-header-cell *matHeaderCellDef class="!flex-none !w-24"></mat-header-cell>
      <mat-cell *matCellDef="let row" class="!flex-none !w-24">
        <button matIconButton [matTooltip]="'action.edit' | translate" (click)="openEdit(row)"><mat-icon>edit</mat-icon></button>
        <button matIconButton [matTooltip]="'action.delete' | translate" (click)="delete(row)"><mat-icon>delete</mat-icon></button>
      </mat-cell>
    </ng-container>

    <mat-header-row *matHeaderRowDef="columns"></mat-header-row>
    <mat-row *matRowDef="let row; columns: columns"></mat-row>

  </mat-table>

  <mat-paginator footer [length]="totalSize()" [pageSize]="20" [pageSizeOptions]="[10,20,50]" (page)="handlePageChange($event)"></mat-paginator>

</ui-main-content>
