<ui-main-content [title]="'rule-set.title' | translate">

  <button matButton="filled" actions (click)="openCreate()">
    <mat-icon>add</mat-icon>
    {{ 'rule-set.create' | translate }}
  </button>

  <mat-table [dataSource]="items()">

    <ng-container matColumnDef="name">
      <mat-header-cell *matHeaderCellDef>{{ 'rule-set.table.name' | translate }}</mat-header-cell>
      <mat-cell *matCellDef="let row">{{ row.name }}</mat-cell>
    </ng-container>

    <ng-container matColumnDef="unitDefinitions">
      <mat-header-cell *matHeaderCellDef>{{ 'rule-set.table.unitDefinitions' | translate }}</mat-header-cell>
      <mat-cell *matCellDef="let row">{{ row.unitDefinitions.length }}</mat-cell>
    </ng-container>

    <ng-container matColumnDef="actions">
      <mat-header-cell *matHeaderCellDef></mat-header-cell>
      <mat-cell *matCellDef="let row">
        <button matIconButton [matTooltip]="'action.detail' | translate" (click)="openDetail(row)">
          <mat-icon>more_horiz</mat-icon>
        </button>
        <button matIconButton [matTooltip]="'action.edit' | translate" (click)="openEdit(row)">
          <mat-icon>edit</mat-icon>
        </button>
        <button matIconButton [matTooltip]="'action.delete' | translate" (click)="delete(row)">
          <mat-icon>delete</mat-icon>
        </button>
      </mat-cell>
    </ng-container>

    <mat-header-row *matHeaderRowDef="columns"></mat-header-row>
    <mat-row *matRowDef="let row; columns: columns"></mat-row>

  </mat-table>

  <mat-paginator footer
    [length]="totalSize()"
    [pageSize]="20"
    [pageSizeOptions]="[10, 20, 50]"
    (page)="handlePageChange($event)">
  </mat-paginator>

</ui-main-content>
