<h2 mat-dialog-title>{{ (ruleSet ? 'rule-set.dialog.edit.title' : 'rule-set.dialog.create.title') | translate }}</h2>

<mat-dialog-content>
  <form [formGroup]="form" class="flex flex-col gap-4 pt-2">
    <mat-form-field>
      <mat-label>{{ 'rule-set.form.name' | translate }}</mat-label>
      <input matInput formControlName="name"/>
      @if (form.controls.name.hasError('required')) {
        <mat-error>{{ 'rule-set.form.error.name' | translate }}</mat-error>
      }
    </mat-form-field>
  </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button matButton mat-dialog-close>{{ 'action.cancel' | translate }}</button>
  <button matButton="filled" (click)="submit()" [disabled]="form.invalid">
    {{ 'action.save' | translate }}
  </button>
</mat-dialog-actions>
