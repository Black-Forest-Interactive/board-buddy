<h2 mat-dialog-title>{{ 'session.dialog.assign.title' | translate }}</h2>

<mat-dialog-content>
  <div class="pt-2 pb-4">
    <mat-form-field class="w-full">
      <mat-label>{{ 'session.form.nation' | translate }}</mat-label>
      <mat-select [value]="selectedNation()" (selectionChange)="selectedNation.set($event.value)">
        @for (n of nations(); track n.id) {
          <mat-option [value]="n.id">{{ n.name }}</mat-option>
        }
      </mat-select>
    </mat-form-field>
  </div>

  @if (available().length === 0) {
    <p class="text-on-surface/60 py-4">{{ 'session.dialog.assign.empty' | translate }}</p>
  } @else {
    <mat-action-list>
      @for (player of available(); track player.id) {
        <button mat-list-item (click)="assign(player)">
          <mat-icon matListItemIcon>person</mat-icon>
          <span matListItemTitle>{{ player.name }}</span>
        </button>
      }
    </mat-action-list>
  }
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button matButton mat-dialog-close>{{ 'action.cancel' | translate }}</button>
</mat-dialog-actions>
