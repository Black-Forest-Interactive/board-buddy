<h2 matDialogTitle>{{ 'session.action.research' | translate }}</h2>
<mat-dialog-content>
  <div class="flex flex-col gap-4 pt-2">
    @for (tier of tiers; track tier) {
      <div>
        <p class="text-xs font-semibold text-on-surface/50 uppercase tracking-wide mb-2">{{ 'session.research.tier' | translate }} {{ tier }}</p>
        <div class="flex flex-wrap gap-2">
          @for (tech of techsByTier()[tier]; track tech) {
            <button matButton
                    [disabled]="!isResearchable(tech)"
                    [class.!bg-primary-container]="isDiscovered(tech)"
                    [class.!text-on-primary-container]="isDiscovered(tech)"
                    (click)="!isDiscovered(tech) && isResearchable(tech) ? research(tech) : null">
              @if (isDiscovered(tech)) {
                <mat-icon class="!text-sm">check_circle</mat-icon>
              }
              {{ 'technology.' + tech | translate }}
            </button>
          }
        </div>
      </div>
    }
  </div>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button matButton matDialogClose>{{ 'action.cancel' | translate }}</button>
</mat-dialog-actions>
