<h2 matDialogTitle>{{ 'session.action.research' | translate }}</h2>
<mat-dialog-content>
  <div class="flex flex-col gap-4 pt-2">
    @for (tier of tiers; track tier) {
      <div>
        <p class="text-xs font-semibold text-on-surface/50 uppercase tracking-wide mb-2">{{ 'session.research.tier' | translate }} {{ tier }}</p>
        <div class="flex flex-wrap gap-2">
          @for (tech of techsByTier()[tier]; track tech.id) {
            <button class="flex items-center gap-2 px-3 py-2 rounded-lg border text-sm transition-colors" [disabled]="!isResearchable(tech)" [class.opacity-40]="!isResearchable(tech) && !isDiscovered(tech)" [class.bg-primary-container]="isDiscovered(tech)" [class.text-on-primary-container]="isDiscovered(tech)" [class.border-primary]="isDiscovered(tech)" [class.border-outline]="!isDiscovered(tech)" (click)="!isDiscovered(tech) && isResearchable(tech) ? research(tech) : null">
              @if (tech.imageUrl) {
                <img [src]="tech.imageUrl" [alt]="tech.name" class="w-6 h-6 rounded object-cover">
              }
              @if (isDiscovered(tech)) {
                <mat-icon class="!text-sm !w-4 !h-4 !leading-4">check_circle</mat-icon>
              }
              {{ tech.name }}
            </button>
          }
        </div>
      </div>
    }
  </div>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button matButton matDialogClose>{{ 'action.cancel' | translate }}</button>
</mat-dialog-actions>
