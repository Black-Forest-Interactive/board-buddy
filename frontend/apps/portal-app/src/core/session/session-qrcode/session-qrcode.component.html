<div class="flex flex-col items-center gap-3 p-2">
  @if (qrUrl()) {
    <img [src]="qrUrl()" alt="QR Code" class="w-48 h-48 rounded-lg">
  }
  <div class="flex items-center gap-2 bg-bb-row-bg border border-bb-border rounded-lg pl-3 pr-1 py-1">
    <mat-icon class="text-bb-muted shrink-0">key</mat-icon>
    <code class="font-mono text-sm font-bold tracking-wide break-all text-bb-ink">{{ sessionId() }}</code>
    <button matIconButton [matTooltip]="'session.action.copyLink' | translate" (click)="copyId()">
      <mat-icon>content_copy</mat-icon>
    </button>
  </div>
  <p class="text-xs text-bb-muted text-center">{{ 'session.join.hint' | translate }}</p>
</div>
