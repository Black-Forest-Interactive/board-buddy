<div class="flex flex-col h-full w-full">
  <mat-sidenav-container class="flex-1 min-h-0 w-full">
    <!-- Side Navigation (desktop only when a bottom-nav is available) -->
    <mat-sidenav #drawer
                 [attr.role]="service.isHandset() ? 'dialog' : 'navigation'"
                 [mode]="service.isHandset() ? 'over' : 'side'"
                 [opened]="!service.isHandset()"
                 class="!bg-bb-sidenav-bg flex flex-col transition-all duration-300"
                 [style.width.rem]="menu.collapsed() ? 6 : 20"
    >
      <ui-shell-menu #menu [menuGroups]="menuGroups()"/>
    </mat-sidenav>
    <!-- Scrollable Content -->
    <mat-sidenav-content class="flex flex-col h-full"
                         [class.!ml-25]="!service.isHandset() && menu.collapsed()"
                         [class.!ml-80]="!service.isHandset() && !menu.collapsed()"
                         [class.!ml-0]="service.isHandset()">
      <div class="p-1 sm:p-2 lg:p-4 mx-auto flex-1 min-h-0 w-full">
        <router-outlet></router-outlet>
      </div>
    </mat-sidenav-content>
  </mat-sidenav-container>

  <!-- Bottom Navigation (mobile, only when the app supplies items) -->
  @if (useBottomNav()) {
    <ui-shell-bottom-nav [items]="bottomNavItems()"/>
  }
</div>
