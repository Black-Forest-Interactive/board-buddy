@if (!service.isHandset()) {
  <footer class="bg-bb-sidenav-bg border-t border-bb-border flex flex-wrap items-center justify-between gap-x-4 gap-y-1 px-4 sm:px-6 py-1.5 text-xs text-bb-muted-2">
    <a href="https://github.com/Black-Forest-Interactive/board-buddy"
       target="_blank"
       rel="noopener noreferrer"
       class="hover:text-bb-ink hover:underline transition-colors">
      Board Buddy {{ currentYear }}
    </a>
    <div class="flex items-center gap-4">
      @if (showLegalLinks()) {
        <a routerLink="/legal-notice" class="hover:text-bb-ink hover:underline transition-colors">{{ 'footer.legalNotice' | translate }}</a>
        <a routerLink="/privacy" class="hover:text-bb-ink hover:underline transition-colors">{{ 'footer.privacy' | translate }}</a>
      }
      <span class="font-mono text-bb-muted-2">v{{ version }}</span>
    </div>
  </footer>
}
