<footer class="bg-gray-100 dark:bg-gray-900 border-t border-gray-200 dark:border-gray-800 flex flex-wrap items-center justify-between gap-x-4 gap-y-1 px-4 sm:px-6 py-1.5 text-xs text-gray-500 dark:text-gray-400">
  <a href="https://github.com/Black-Forest-Interactive/board-buddy"
     target="_blank"
     rel="noopener noreferrer"
     class="hover:text-gray-800 dark:hover:text-gray-200 hover:underline transition-colors">
    Board Buddy {{ currentYear }}
  </a>
  <div class="flex items-center gap-4">
    @if (showLegalLinks()) {
      <a routerLink="/legal-notice" class="hover:text-gray-800 dark:hover:text-gray-200 hover:underline transition-colors">{{ 'footer.legalNotice' | translate }}</a>
      <a routerLink="/privacy" class="hover:text-gray-800 dark:hover:text-gray-200 hover:underline transition-colors">{{ 'footer.privacy' | translate }}</a>
    }
    <span class="text-gray-400 dark:text-gray-600">v{{ version }}</span>
  </div>
</footer>
