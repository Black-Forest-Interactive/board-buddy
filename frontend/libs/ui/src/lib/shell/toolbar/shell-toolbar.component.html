<mat-toolbar class="h-14 sm:h-[58px] px-3 sm:px-6 !bg-[var(--mat-sys-primary)] !text-[var(--mat-sys-on-primary)] shadow-[0_2px_4px_rgba(0,0,0,.24)]">
  <div class="flex w-full items-center gap-2 sm:gap-4">

    <a routerLink="/" aria-label="Go to home page" class="flex items-center gap-2 flex-shrink-0 cursor-pointer">
      <span class="flex items-center justify-center w-8 h-8 rounded-lg bg-bb-brass text-bb-navy font-bold text-sm shrink-0">BB</span>
      @if (!service.isHandset()) {
        <span class="font-display text-bb-gold text-lg tracking-[.06em]">Board Buddy</span>
      }
    </a>

    <div class="flex-1"></div>

    <h3 class="text-lg sm:text-2xl font-normal truncate px-2">
      {{ service.title() | translate }}
    </h3>

    <div class="flex-1"></div>

    @if (service.isHandset()) {
      <button matIconButton [matMenuTriggerFor]="langmenu" aria-label="Change language" class="flex-shrink-0">
        <mat-icon>language</mat-icon>
      </button>
    } @else {
      <button matButton="filled" [matMenuTriggerFor]="langmenu" aria-label="Change language" class="flex-shrink-0">
        <mat-icon>language</mat-icon>
        {{ 'ACTION.Language' | translate }}
      </button>
    }

    @if (service.isHandset()) {
      <button matIconButton (click)="showHelp()" aria-label="Help" class="flex-shrink-0">
        <mat-icon>help</mat-icon>
      </button>
    } @else {
      <button matButton="filled" (click)="showHelp()" aria-label="Help" class="flex-shrink-0">
        <mat-icon>help</mat-icon>
        {{ 'ACTION.Help' | translate }}
      </button>
    }

    @if (service.playerName()) {
      <div class="flex items-center gap-2 shrink-0">
        <div class="w-8 h-8 rounded-full bg-white/20 flex items-center justify-center text-sm font-bold shrink-0">
          {{ service.playerInitial() }}
        </div>
        <span class="text-sm font-medium hidden sm:block max-w-28 truncate">{{ service.playerName() }}</span>
      </div>
    }

    <lib-theme-toggle-button/>
  </div>
</mat-toolbar>

<!-- Language Menu -->
<mat-menu #langmenu="matMenu">
  <button mat-menu-item (click)="service.setLanguage('en')">
    @if (service.lang() === 'en') {
      <mat-icon>check</mat-icon>
    }
    <span>{{ 'LANG.English' | translate }}</span>
  </button>
  <button mat-menu-item (click)="service.setLanguage('de')">
    @if (service.lang() === 'de') {
      <mat-icon>check</mat-icon>
    }
    <span>{{ 'LANG.German' | translate }}</span>
  </button>
</mat-menu>
